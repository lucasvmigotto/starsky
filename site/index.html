<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches color.bg so the mobile browser chrome does not render a light
         bar above a dark page (000-design-system T009). -->
    <meta name="theme-color" content="#070b14" />
    <meta
      name="description"
      content="Starsky static explorer — a printable night-sky atlas moment, recomputed in your browser from a share link."
    />
    <title>Starsky — Night-Sky Explorer</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="./favicon.svg"
    />
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:site_name"
      content="Starsky"
    />
    <meta
      property="og:title"
      content="Starsky — Night-Sky Explorer"
    />
    <meta
      property="og:description"
      content="Starsky static explorer — a printable night-sky atlas moment, recomputed in your browser from a share link."
    />
    <meta
      property="og:url"
      content="%VITE_FULL_APP_URL%/"
    />
    <meta
      property="og:image"
      content="%VITE_FULL_APP_URL%/og-banner.png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />
    <meta
      property="og:image:alt"
      content="Star map poster with constellation lines and labels on a dark sky."
    />
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:title"
      content="Starsky — Night-Sky Explorer"
    />
    <meta
      name="twitter:description"
      content="Starsky static explorer — a printable night-sky atlas moment, recomputed in your browser from a share link."
    />
    <meta
      name="twitter:image"
      content="%VITE_FULL_APP_URL%/og-banner.png"
    />
    <!-- Fonts are bundled (BCR-0004): no third-party font request. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="./fonts/CormorantGaramond.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
