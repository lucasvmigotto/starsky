[project]
name = "starpy"
version = "0.1.0"
description = "Personalized night-sky poster generator (Gradio + CLI), fully open source."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-only" }
dependencies = [
    "click>=8.1.8",
    "gradio>=6.3.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "polars>=1.37.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "scipy>=1.14.0",
    "skyfield>=1.53",
    "timezonefinder>=6.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
    "ty>=0.0.81",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "starpy"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast pure-function tests",
    "integration: needs local data cache (no network)",
    "golden: reference-image tests",
    "network: live network (never in CI)",
]
