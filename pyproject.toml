[project]
name = "starsky"
version = "1.1.1"
description = "Personalized night-sky poster generator — the site renders; the CLI builds its sky data."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0-only" }
dependencies = [
    "click>=8.1.8",
    "httpx>=0.28.1",
    "polars>=1.37.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "respx>=0.22.0",
    "ruff>=0.14.0",
    "ty>=0.0.81",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "starsky"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast pure-function tests",
    "network: live network (never in CI)",
]
