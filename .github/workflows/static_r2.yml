name: Static viewer to R2

on:
  push:
    branches: ["main"]
    paths:
      - "static_site/viewer/**"
      - ".github/workflows/static_r2.yml"
  pull_request:
    paths:
      - "static_site/viewer/**"
      - ".github/workflows/static_r2.yml"
  workflow_dispatch:

concurrency:
  group: static-r2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: static_site/viewer

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: viewer-dist
          path: static_site/viewer/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: static-viewer
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: dist

      - name: Sync hashed assets (immutable)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          aws s3 sync dist "s3://${R2_BUCKET}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-encoding "identity"

      - name: Upload index.html (no-cache)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          aws s3 cp dist/index.html "s3://${R2_BUCKET}/index.html" \
            --endpoint-url "${R2_ENDPOINT}" \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"
