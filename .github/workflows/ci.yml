name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"

      - name: Sync dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Declarative import style
        run: uv run python scripts/check_declarative_imports.py src tests

      - name: Type check (ty)
        run: uv run ty check src tests

      - name: Tests
        run: uv run pytest -q

      # The CLI's whole job is the data the browser fetches (BCR-0005), so CI
      # builds it and asserts the shape the client depends on. Downloads the
      # Hipparcos and Stellarium sources; no ephemeris, no renderer.
      - name: Build the sky data
        run: |
          uv run python -m starpy cache warm
          uv run python -m starpy catalog --output-dir /tmp/starpy-data
          test -s /tmp/starpy-data/catalog.json
          test -s /tmp/starpy-data/constellations.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          stars = json.loads(Path("/tmp/starpy-data/catalog.json").read_text())["stars"]
          segs = json.loads(Path("/tmp/starpy-data/constellations.json").read_text())["segments"]
          assert len(stars) > 8000, len(stars)
          assert len(segs) > 500, len(segs)
          assert len(stars[0]) == 4 and len(segs[0]) == 4
          print(f"ok: {len(stars)} stars, {len(segs)} segments")
          PY
