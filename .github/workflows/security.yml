name: Security

# Supply-chain controls (`devsecops:supply-chain`).
#
# Chosen so nothing needs a paid plan or a local install:
#   - dependency-review: PR-time SCA on the lockfiles (needs GHAS on private
#     repos; the step is skipped with a note when the event lacks the base ref);
#   - Trivy: filesystem scan (dependencies), secret scan, and config/IaC scan
#     of the Dockerfiles and workflows — one tool, three controls;
#   - CodeQL: SAST for the Python CLI and the TypeScript site.
#
# Gates follow the reference: **block** on secrets, and on critical/high
# vulnerabilities that have a fix; everything else warns and is tracked.

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  schedule:
    # Deep scan weekly, so drift in the dependency graph is caught even when
    # nobody changes a manifest.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast PR-time dependency review. Fails on a vulnerable or denied-license
  # dependency introduced by the PR.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # The license policy: the project is GPL-3.0-only, so copyleft and
          # permissive are fine; anything unknown or explicitly non-free is not.
          deny-licenses: >-
            GPL-2.0-only,
            GPL-2.0-or-later,
            SSPL-1.0,
            BUSL-1.1,
            Commons-Clause,
            Elastic-2.0

  # Dependencies, secrets and Dockerfile/config in one pass.
  trivy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Secrets first: this is the one control that blocks outright.
      - name: Secret scan (working tree)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: secret
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      # Dependencies: block only when a fix exists, so the repo is not held
      # hostage by an unfixed advisory upstream.
      - name: Dependency scan (lockfiles)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Config/Dockerfile: warn-only for now (no IaC to scan, two Dockerfiles).
      - name: Misconfiguration scan (Dockerfiles)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: config
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

  # SAST. Python for the CLI, JavaScript/TypeScript for the site.
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"
