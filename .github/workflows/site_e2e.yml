name: Site e2e

# Chromium + Firefox journeys, accessibility and contrast (qa:strategy).
# Browsers come from the Playwright container image, never from
# `playwright install` on the runner (qa/references/browsers.md).

on:
  push:
    # `main` is the release gate; `dev` is included so the integration branch is
    # validated before it merges up (the strategy's "full matrix on main" plus a
    # real check on the branch work actually lands on).
    branches: ["main", "dev"]
    paths:
      - "site/**"
      - "specs/007-renderer-export/fixtures/**"
      - ".github/workflows/site_e2e.yml"
  pull_request:
    paths:
      - "site/**"
      - "specs/007-renderer-export/fixtures/**"
      - ".github/workflows/site_e2e.yml"
  workflow_dispatch:

concurrency:
  group: site-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so the browser version matches the image tag (containers.md §3).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble

jobs:
  e2e:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # No `--user` override: the image's default user is already the non-root
      # `pwuser` (1001), and forcing a UID fights `actions/checkout`, which
      # writes the workspace as root before the job steps run.
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The Playwright image has Node but no Python toolchain, and the sky data
      # the site fetches is built by the Python CLI. `setup-uv` installs uv into
      # the job's home; the data build runs in the repo root.
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:

      - name: Build the sky data
        working-directory: .
        run: |
          for i in 1 2 3; do
            uv run python -m starpy cache warm \
              && uv run python -m starpy catalog \
              && break
            echo "data build attempt $i failed; retrying..."
            sleep $((i * 30))
          done
          test -f site/public/data/catalog.json

      - name: Install dependencies
        working-directory: site
        # Bun is the project's package manager but the Playwright image ships
        # only Node, and it has no `unzip` — so the official installer fails.
        # Fetch the release zip and extract it with Python, which is present.
        run: |
          mkdir -p /tmp/bun/bin /tmp/bun/build && cd /tmp/bun/build
          curl -fsSL -o bun.zip \
            "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip"
          python3 -c 'import zipfile; zipfile.ZipFile("bun.zip").extractall(".")'
          cp bun-linux-x64/bun /tmp/bun/bin/bun && chmod +x /tmp/bun/bin/bun
          /tmp/bun/bin/bun --version
          /tmp/bun/bin/bun install --frozen-lockfile

      - name: Build the site
        working-directory: site
        # Absolute path: PATH edits do not survive into the container's steps.
        run: /tmp/bun/bin/bun run build

      - name: Run the journeys
        working-directory: site
        env:
          CI: "true"
          E2E_SERVE_CMD: node e2e/serve.mjs 4173
        # PRs get the fast project only; `main` (the release gate) and any
        # manual run get the full matrix — Chromium, Firefox and the mobile
        # viewport. Keeps PR feedback quick without weakening the gate that
        # matters (test-strategy.md, gates per pipeline stage).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --project=chromium
          else
            npx playwright test
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            site/test-results
          retention-days: 7
