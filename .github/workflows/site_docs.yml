name: Docs to R2

# The documentation site (`docs/site/`): verify, then deploy to the docs
# bucket. The product (`site/`) deploys to the starsky bucket via
# `site_r2.yml` — buckets are per-site, one variable each, so neither site
# can sync into the other's bucket.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/site_docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/site_docs.yml"
  workflow_dispatch:

concurrency:
  group: site-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/site
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ./.tool-versions

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          DOCS_PUBLIC_URL: https://docs.lucasvmigotto.me/starsky/

      - name: No secrets in the bundle
        run: |
          if grep -rEo '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' dist/; then
            echo "::error::secret-like string found in dist/"
            exit 1
          fi
          echo "no secret-like strings in dist/"

      - name: Guard prefix-scoped R2 deploy
        run: |
          # Fitness function: every R2 sync/cp must be prefix-scoped, so a
          # project can never wipe a bucket root. $GITHUB_WORKSPACE: this
          # job defaults to `docs/site/` as its working directory, so a
          # repo-relative path would miss and pass vacuously.
          bad=$(grep -nE '^[[:space:]]+aws s3 (sync|cp)' "$GITHUB_WORKSPACE/.github/workflows/site_docs.yml" | grep -v 'R2_PREFIX' || true)
          if [ -n "$bad" ]; then
            echo "::error::root-scoped R2 target detected — every deploy must use \$R2_PREFIX"
            echo "$bad"
            exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: docs/site/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: starsky-docs
      url: https://docs.lucasvmigotto.me/starsky/
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-dist
          path: dist

      - name: Validate R2 configuration
        # Buckets are per-site: docs go to the docs bucket, the product to
        # the starsky bucket (`site_r2.yml`). The names are repository
        # variables; only the secret is a secret.
        run: |
          missing=0
          for var in CLOUDFLARE_R2_ACCOUNT_ID CLOUDFLARE_R2_ACCOUNT_SECRET \
                     CLOUDFLARE_R2_ENDPOINT_S3_CLIENT CLOUDFLARE_R2_BUCKET_DOCS; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          case "${CLOUDFLARE_R2_ENDPOINT_S3_CLIENT}" in
            https://*) echo "R2 endpoint OK" ;;
            *) echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT must start with https://"; exit 1 ;;
          esac
          case "${R2_PREFIX}" in
            /*/) ;;
            *) echo "::error::R2_PREFIX must look like /<slug>/ (got: '${R2_PREFIX}')"; exit 1 ;;
          esac
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_SECRET }}
          CLOUDFLARE_R2_ENDPOINT_S3_CLIENT: ${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET_DOCS }}
          R2_PREFIX: /starsky/

      - name: Ensure AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq awscli
          fi
          aws --version

      # Hashed Vite assets: immutable, long-lived. Entry HTML, llms.txt /
      # llms-full.txt and the per-page .md files: no-cache with their real
      # content types (content changes per deploy; crawlers and agents
      # fetch them directly). Scoped to the docs bucket — the product's
      # starsky bucket is deployed by `site_r2.yml` and untouched here.
      #
      # `index.html` uploads last: it is the entry point, so a failed deploy
      # leaves the previous entry serving rather than a new entry pointing
      # at half-synced bytes.
      - name: Sync docs site to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_SECRET }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}
          R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET_DOCS }}
          R2_PREFIX: /starsky/
        run: |
          aws s3 sync dist "s3://$R2_BUCKET${R2_PREFIX}" \
            --endpoint-url "$R2_ENDPOINT" \
            --delete \
            --exclude "index.html" \
            --exclude "docs/*.md" \
            --exclude "docs/*/*.md" \
            --exclude "*.txt" \
            --exclude "favicon.svg" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/docs "s3://$R2_BUCKET${R2_PREFIX}docs" \
            --endpoint-url "$R2_ENDPOINT" \
            --delete \
            --cache-control "no-cache" \
            --content-type "text/markdown; charset=utf-8"
          aws s3 cp dist/llms.txt "s3://$R2_BUCKET${R2_PREFIX}llms.txt" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache" \
            --content-type "text/plain; charset=utf-8"
          aws s3 cp dist/llms-full.txt "s3://$R2_BUCKET${R2_PREFIX}llms-full.txt" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache" \
            --content-type "text/plain; charset=utf-8"
          aws s3 cp dist/favicon.svg "s3://$R2_BUCKET${R2_PREFIX}favicon.svg" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache" \
            --content-type "image/svg+xml"
          aws s3 cp dist/index.html "s3://$R2_BUCKET${R2_PREFIX}index.html" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "no-cache" \
            --content-type "text/html; charset=utf-8"
