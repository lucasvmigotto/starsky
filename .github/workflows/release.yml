name: Tag and Release

# CI/CD-owned tagging: run manually from the Actions tab. The tag is taken
# from pyproject.toml (single source of truth, never `v`-prefixed) and the
# GitHub Release is created in the same run. Source-only release; container
# tags are a separate follow-up.
on:
  workflow_dispatch:

jobs:
  tag-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For build provenance: keyless OIDC signing, no long-lived key.
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; refusing to re-release." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "starpy $VERSION"
          git push origin "$VERSION"

      - name: Generate SBOM
        # CycloneDX over both lockfiles. Trivy is already used by the security
        # workflow, so this adds no new tool to the trust surface.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          format: cyclonedx
          output: sbom.cdx.json
          scan-ref: .

      - name: Attest the SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: sbom.cdx.json
