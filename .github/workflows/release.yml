name: Tag and Release

# Every push to main releases if the commits since the last tag warrant it.
# scripts/release.py decides: feat → minor; fix, perf, refactor → patch;
# "type!:" or BREAKING CHANGE → major; anything else → no release. A release
# bumps the version carriers (site/package.json, pyproject.toml, uv.lock),
# promotes CHANGELOG.md's "## Unreleased" (or generates a section), commits
# "chore(release): X.Y.Z", tags X.Y.Z (never `v`-prefixed) and publishes a
# GitHub Release with the SBOM attached.
#
# The bot pushes that commit and tag straight to main with GITHUB_TOKEN:
# branch protection or a ruleset that requires pull requests (or doesn't let
# github-actions[bot] bypass it) rejects the push. Pushes made with
# GITHUB_TOKEN don't trigger workflows, so the release commit can't loop; the
# chore(release) condition below is a second guard.
#
# --initial 1.1.0 only matters before the first tag exists (there are no tags
# yet); afterwards the tag decides and the flag is inert.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # For build provenance: keyless OIDC signing, no long-lived key.
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Dispatches have no head commit; only pushes do. Either way, releases
    # cut from main alone — never from a branch the workflow was dispatched on.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the release commit and tag, create the release
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits since the last tag
          fetch-tags: true
          persist-credentials: true # the push below uses the checkout's GITHUB_TOKEN

      - name: Plan
        id: plan
        run: |
          set +e
          python3 scripts/release.py --dry-run --initial 1.1.0
          code=$?
          set -e
          case "$code" in
            0) echo "release=true" >>"$GITHUB_OUTPUT" ;;
            3) echo "release=false" >>"$GITHUB_OUTPUT"; echo "No release needed." ;;
            *) exit "$code" ;;
          esac

      - name: Release
        id: release
        if: ${{ steps.plan.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898496+github-actions[bot]@users.noreply.github.com"
          version="$(python3 scripts/release.py --initial 1.1.0)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          python3 scripts/release.py --notes "$version" >"$RUNNER_TEMP/notes.md"
          if git rev-parse "$version" >/dev/null 2>&1; then
            echo "Tag $version already exists; refusing to re-release." >&2
            exit 1
          fi
          git add CHANGELOG.md site/package.json pyproject.toml uv.lock
          git commit -m "chore(release): $version"
          git tag -a "$version" -m "starsky $version"
          # Rejected (and nothing published) if main moved since this run started;
          # the next run releases those commits too.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$version"

      - name: Generate SBOM
        if: ${{ steps.plan.outputs.release == 'true' }}
        # CycloneDX over both lockfiles. Trivy is already used by the security
        # workflow, so this adds no new tool to the trust surface.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          output: sbom.cdx.json
          scan-ref: .

      - name: Attest the SBOM
        if: ${{ steps.plan.outputs.release == 'true' }}
        # The v4.2.2 SHA (4d10147) is unresolvable by the runner — two
        # consecutive runs failed action resolution with it while the tag
        # itself resolves. v4.1.1 until a resolvable v4.2.x SHA is confirmed.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: sbom.cdx.json

      - name: Create GitHub Release
        if: ${{ steps.plan.outputs.release == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: ${{ steps.release.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: sbom.cdx.json
