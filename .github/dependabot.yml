# Dependabot — keeps every ecosystem's pins current.
#
# Chosen over Renovate because it is native to GitHub (no app to install, no
# token) and covers all four ecosystems here. It also moves the commit-SHA pins
# on third-party actions, which `devsecops:supply-chain` requires and which
# nothing else would maintain.
#
# Grouping keeps PR volume low for a solo maintainer: minor and patch land
# together per ecosystem; majors come individually so a breaking change is
# reviewed on its own.
version: 2
updates:
  # Python CLI and its dependency groups (uv).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The site (Bun lockfile).
  - package-ecosystem: "bun"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      site-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Third-party actions: this is what keeps the commit-SHA pins fresh, so the
  # pinning rule does not freeze the repo on stale, unaudited actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Base images (the Dockerfile's DHI/public fallback tags).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
